[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "axcut"
version = "0.1.0"
description = "Local agentic video editing system with a web UI, deepagents runtime, and Python media worker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper>=1.1.1,<2.0.0",
  "huggingface-hub>=1.0.0,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "python-dotenv>=1.1.1,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "py/axcut-core/src/axcut_core",
  "py/axcut-worker/src/axcut_worker",
]
